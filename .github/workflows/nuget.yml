name: NuGet (Cr1140.Avalonia)

on:
  push:
    tags:
      - 'avalonia-v*'
  pull_request:
    paths:
      - 'cr1140-avalonia/**'
  workflow_dispatch:

# Cancel in-progress runs for the same ref when a newer commit is pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: jobs only read the repo contents.
permissions:
  contents: read

jobs:
  pack:
    name: pack Cr1140.Avalonia
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # OIDC token for NuGet trusted publishing
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Pack library
        run: dotnet pack cr1140-avalonia/Cr1140.Avalonia.csproj -c Release -o dist/nuget

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: dist/nuget/*.nupkg

      # Push to nuget.org only on version tags, via NuGet trusted publishing (OIDC):
      # NuGet/login exchanges the GitHub OIDC token for a short-lived API key — no
      # NUGET_API_KEY secret. Set the NUGET_USER repo variable (Settings → Secrets
      # and variables → Actions → Variables) to the nuget.org account that owns the
      # trusted-publishing policy for Cr1140.Avalonia.
      - name: NuGet login (trusted publishing / OIDC)
        if: startsWith(github.ref, 'refs/tags/avalonia-v')
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to NuGet.org
        if: startsWith(github.ref, 'refs/tags/avalonia-v')
        run: dotnet nuget push "dist/nuget/*.nupkg" --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
